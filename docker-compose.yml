services:
  bot:
    build: .
    user: "0:0"
    env_file:
      - path: .env
        required: false
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-}
      DATA_DIR: /data
    volumes:
      - ${TRIPSPLIT_DATA_DIR:-./data}:/data
    networks:
      - allowed-internet
    restart: unless-stopped

networks:
  allowed-internet:
    external: true
