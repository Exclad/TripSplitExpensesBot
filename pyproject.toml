[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripsplitexpenses"
version = "0.1.0"
description = "Telegram bot for trip expense tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.0,<23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tripsplitexpenses"]
